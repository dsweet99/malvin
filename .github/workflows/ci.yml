name: CI

on:
  push:
    branches: [main]
  pull_request:

# No workflow-level concurrency: cancel-in-progress left CI #10 wedged for
# 35+ minutes while later runs (with fixed 4-way shards) waited in queue.

env:
  MALVIN_SKIP_SDK_BRIDGES: "1"
  MALVIN_SKIP_DOCKER_SELFTESTS: "1"
  PYTHONPATH: src/python

jobs:
  python-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tools
        run: |
          pip install \
            'pytest==8.3.4' \
            'ruff==0.15.14' \
            'click==8.4.2' \
            'modal==1.5.0' \
            'typing-extensions==4.12.2'

      - name: ruff check
        run: ruff check

      - name: pytest tests
        run: python -m pytest tests --tb=short -ra -q

  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --jobs 1 --all-targets --all-features -- -D warnings -W clippy::cargo

      - name: Install kiss
        run: cargo install kiss-ai --version 0.4.9 --locked

      - name: kiss check
        run: kiss check

  rust-test:
    needs: rust-lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: build test binaries
        run: cargo test --no-run --all-targets

      - name: malvin rust test gate partition
        # Wall-clock cap per shard; runners are slower than local nextest.
        run: timeout 40m cargo nextest run --partition hash:${{ matrix.partition }}/4
        env:
          NEXTEST_RETRIES: "1"
