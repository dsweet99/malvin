name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MALVIN_SKIP_SDK_BRIDGES: "1"
  MALVIN_SKIP_DOCKER_SELFTESTS: "1"
  PYTHONPATH: src/python

jobs:
  python-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tools
        run: |
          pip install \
            'pytest==8.3.4' \
            'ruff==0.15.14' \
            'click==8.4.2' \
            'modal==1.5.0' \
            'typing-extensions==4.12.2'

      - name: ruff check
        run: ruff check

      - name: pytest tests
        run: |
          python -m pytest tests --tb=short -ra -p no:typeguard || {
            python -m pytest tests --tb=long -ra -p no:typeguard --last-failed -q
            exit 1
          }

  rust-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --jobs 1 --all-targets --all-features -- -D warnings -W clippy::cargo

      - name: Install kiss
        run: cargo install kiss-ai --version 0.4.9 --locked

      - name: kiss check
        run: kiss check

      - name: malvin rust test gate
        run: ./admin/malvin_rust_test_gate.sh
