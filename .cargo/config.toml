# cargo-difftests instrumentation profile (used only by admin/difftests_*.sh).
# This host has 24 logical CPUs and about 15 GiB of RAM. Cargo's default is one
# rustc job per CPU. Two concurrent rustc processes exhausted RAM and the
# machine stalled on swap. Cap every cargo command that does not pass --jobs
# (including the clippy pre-commit hook).
[build]
jobs = 1

[profile.difftests]
inherits = "dev"
rustflags = ["--cfg", "cargo_difftests"]

[env]
RUST_TEST_THREADS = "1"
# pi_agent_rust >= 0.3 pulls fsqlite 0.3.x, whose pager and btree crates use
# `#![feature(core_intrinsics)]` on x86_64. Allow unstable features for those two crates only.
RUSTC_BOOTSTRAP = "fsqlite_pager,fsqlite_btree"

[unstable]
profile-rustflags = true
