# ~/.cargo/config.toml on this host sets jobs = 1. No rustc for this project
# exceeds about 0.5 GiB, so four at once fit in RAM and build about 3.5x faster.
# The wrapper runs sccache. Set MALVIN_SCCACHE=0 to bypass it.
[build]
jobs = 4
rustc-wrapper = "admin/rustc_sccache.sh"

# cargo-difftests instrumentation profile (used only by admin/difftests_*.sh).
[profile.difftests]
inherits = "dev"
rustflags = ["--cfg", "cargo_difftests"]

[env]
RUST_TEST_THREADS = "1"
# pi_agent_rust's build.rs embeds a build timestamp (vergen) unless this is set.
# A new timestamp on every build made sccache recompile it (about 250 s).
SOURCE_DATE_EPOCH = "0"

[unstable]
profile-rustflags = true
