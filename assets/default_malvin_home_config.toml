mem_limit_gb = 4
# Keep the local-LLM manager alive this long after the last local-model call.
time_since_last_call_seconds = 600
# Terminal color palette: "dark" (default) or "light" (for pale backgrounds).
theme = "dark"
# Ask a nested malvin run to populate missing per-model token prices before a run.
# Set false to leave unset rates at zero; --no-auto-costs disables it for one run.
auto_setup_costs = true

# Short names for `--model` / `[agent].model` (no ':' in the key).
# [aliases.models]
# astra = "pi:openrouter/openai/this/is/too/long/gpt-astra"

# Short names for `--remote` (not `modal`; no ':', '[', ']', ',' or '=' in the key).
# [aliases.remotes]
# big = "modal:sandbox[gpu=A100,mem=32,timeout=2h]"

[agent]
model = "cursor:auto"
max_acp_retries = 3

# Cursor-mode USD cost rates ($ per million tokens) for model `cursor:auto`.
# COST uses usd_per_microtoken_* × counts / 1e6 (0.0000 when all are 0).
# Add `[agent.cursor.<name>]` or `[agent.pi."<provider/model>"]` for other models.
[agent.cursor.auto]
usd_per_microtoken_in = 0
usd_per_microtoken_out = 0
usd_per_microtoken_cache_read = 0
usd_per_microtoken_cache_write = 0

# Run a program after each finished direct message. Words split on whitespace.
# Quote a word to keep spaces. A word that is exactly {body} becomes the DM text.
# With no {body} word, the text is written to the program's standard input.
# Omit [dm], leave on_emit empty, or set on_emit = [] to run nothing.
# [dm]
# on_emit = "slack send {body}"

[logs]
# Max run directories per workspace bucket; 0 = unlimited.
max_count = 1000
# Delete runs older than this many days (dirname timestamp, else mtime).
max_age_days = 90
# Cap total size of ~/.malvinconf/logs/<hash>/ (B, KiB, MiB, GiB, TiB). Empty = disabled.
max_bytes = "2GiB"
