[package]
name = "malvin"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Non-interactive research and coding agent"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dsweet99/malvin"
keywords = ["malvin"]
categories = ["development-tools"]
exclude = [
    ".cursor/",
    ".cursorrules",
    ".malvin/incomplete_handoff_*",
    ".malvin/mbc2_*",
    ".malvin/fast_task_results/",
    ".requested_plan.md",
    "opt_prog.md",
    "plan.md",
    "report-disc.md",
    "/report.md",
    "summary-ft.md",
    "bugs.md",
]
build = "build.rs"

[profile.dev]
incremental = true
debug = "line-tables-only"
codegen-units = 3
lto = "off"

[profile.release]
lto = "off"

[profile.dev.package.malvin]
codegen-units = 3

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
terminal_size = "0.4"
thiserror = "1"
toml = "0.8"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
termimad = "0.34"
unicode-width = "0.2"
kstring = "=2.0.2"
pi = { package = "pi_agent_rust", version = "0.6.1", default-features = false, features = ["sqlite-sessions"] }
asupersync = { version = "0.5.0", default-features = false }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lib]
name = "malvin"
path = "src/lib.rs"

[[bin]]
name = "malvin"
path = "src/main.rs"
test = false
doctest = false
bench = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = "warn"
nursery = "warn"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
errno = "0.3"
libc = "0.2"
libproc = "0.14"
