[package]
name = "malvin"
version = "0.2.3"
edition = "2024"
rust-version = "1.96"
description = "Non-interactive research and coding agent"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dsweet99/malvin"
keywords = ["malvin"]
categories = ["development-tools"]
# Broken local symlinks under .cursor/ break `cargo package` when present as
# untracked files; keep them out of the published crate.
exclude = [
    ".cursor/",
    ".cursorrules",
    ".malvin/incomplete_handoff_*",
    ".malvin/fast_task_results/",
    ".requested_plan.md",
    "opt_prog.md",
    "plan.md",
    "report-disc.md",
    "report.md",
    "summary-ft.md",
    "bugs.md",
]
# Agent backends need the Node bridge under cursor-sdk-bridge/.
# build.rs installs @cursor/sdk into ~/.malvin_home/sdk-bridges/
# during cargo build / cargo install when in-tree bridges are not already built
# (requires Node ≥ 22.13).
build = "build.rs"

[profile.dev]
incremental = true
codegen-units = 8
debug = 0
lto = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
terminal_size = "0.4"
thiserror = "1"
toml = "0.8"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
termimad = "0.34"
unicode-width = "0.2"
rusqlite = { version = "0.39", features = ["bundled"] }
pi = { package = "pi_agent_rust", version = "0.1.23", default-features = false, features = ["sqlite-sessions"] }
asupersync = { version = "0.3.10", default-features = false }
async-trait = "0.1"

[dev-dependencies]
portable-pty = "0.8"
tokio = { version = "1", features = ["test-util"] }

[lib]
name = "malvin"
path = "src/lib.rs"

[[bin]]
name = "malvin"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = "warn"
nursery = "warn"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
errno = "0.3"
libc = "0.2"
libproc = "0.14"
