[package]
name = "malvin"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Non-interactive research and coding agent"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dsweet99/malvin"
keywords = ["malvin"]
categories = ["development-tools"]
exclude = [
    ".cursor/",
    ".cursorrules",
    ".malvin/incomplete_handoff_*",
    ".malvin/mbc2_*",
    ".malvin/fast_task_results/",
    ".requested_plan.md",
    "opt_prog.md",
    "plan.md",
    "report-disc.md",
    "/report.md",
    "summary-ft.md",
    "bugs.md",
]
build = "build.rs"

# codegen-units applies to malvin only. Set on [profile.dev], it would also
# apply to dependencies.
[profile.dev]
incremental = true
debug = "line-tables-only"
lto = "off"

[profile.release]
lto = "off"

[profile.dev.package.malvin]
codegen-units = 3

# Backtraces lose line numbers inside dependencies; dev builds are about 14% faster.
[profile.dev.package."*"]
debug = false

# Local optimized builds: `cargo build --profile release-local`. Shipped builds
# (`cargo install malvin`) use [profile.release] unchanged.
[profile.release-local]
inherits = "release"
incremental = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
terminal_size = "0.4"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
termimad = "0.34"
unicode-width = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lib]
name = "malvin"
path = "src/lib.rs"

[[bin]]
name = "malvin"
path = "src/main.rs"
test = false
doctest = false
bench = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = "warn"
nursery = "warn"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
errno = "0.3"
libc = "0.2"
libproc = "0.14"
